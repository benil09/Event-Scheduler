apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: event-scheduler
  labels:
    app: temporal-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-ui
  template:
    metadata:
      labels:
        app: temporal-ui
    spec:
      enableServiceLinks: false
      containers:
      - name: temporal-ui
        image: temporalio/ui:2.30.0
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: TEMPORAL_PORT
          value: "8080"
        - name: TEMPORAL_UI_PORT
          value: "8080"
        - name: TEMPORAL_ADDRESS
          value: "temporal:7233"
        - name: TEMPORAL_CORS_ORIGINS
          value: "http://localhost:8080"
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: event-scheduler
spec:
  selector:
    app: temporal-ui
  ports:
  - name: http
    port: 8080
    targetPort: 8080
