apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-scheduler-worker
  namespace: event-scheduler
  labels:
    app: event-scheduler-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-scheduler-worker
  template:
    metadata:
      labels:
        app: event-scheduler-worker
    spec:
      imagePullSecrets:
      - name: acr-secret
      containers:
      - name: worker
        image: eventscheduleracr24944.azurecr.io/event-scheduler-worker:v2
        imagePullPolicy: Always
        envFrom:
        - secretRef:
            name: app-secrets
        - configMapRef:
            name: app-config
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
